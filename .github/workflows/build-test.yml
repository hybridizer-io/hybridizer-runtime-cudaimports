name: Runtime tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required reports and process timeout
        run: python -B tools/test_run_tests.py
      - name: Two clean fast runs
        run: python tools/run-tests.py --suite fast --repeat 2 --results "${{ runner.temp }}/runtime-fast"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-fast-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/runtime-fast/summary.json
            ${{ runner.temp }}/runtime-fast/**/build.log
            ${{ runner.temp }}/runtime-fast/**/test.log
            ${{ runner.temp }}/runtime-fast/**/*.trx
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required Linux native stub tests
        run: python tools/run-tests.py --suite native --repeat 2 --results "${{ runner.temp }}/runtime-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-native-linux
          path: |
            ${{ runner.temp }}/runtime-native/summary.json
            ${{ runner.temp }}/runtime-native/**/build.log
            ${{ runner.temp }}/runtime-native/**/test.log
            ${{ runner.temp }}/runtime-native/**/*.trx
          if-no-files-found: error
